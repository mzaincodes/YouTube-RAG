[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#141a29"
textColor = "#e6e9f0"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
